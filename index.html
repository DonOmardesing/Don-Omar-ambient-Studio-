<style>
:root{--blue:#20aaff;--glass:rgba(4,12,28,.78);--line:rgba(85,184,255,.65)}
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#030711;color:#fff;font-family:Arial,Helvetica,sans-serif}
.scene{position:relative;width:100vw;height:100dvh;overflow:hidden;background:#050916}
.backdrop{position:absolute;inset:0;width:100%;height:100%;object-fit:fill;z-index:1}
/* El video ocupa solamente el ventanal; la parte inferior de la foto (hombre y sillón) queda intacta. */
.screen-video{position:absolute;z-index:2;left:0;top:0;width:100%;height:68.3%;overflow:hidden;clip-path:polygon(0 0,100% 0,100% 98%,87% 100%,55% 99.2%,20% 98.7%,0 97.5%);background:#030817}
.screen-video iframe{width:100%;height:100%;border:0;display:block}
.top-title{position:absolute;z-index:5;top:1.6%;left:25%;width:72%;text-align:center;padding:.7em .5em;border-radius:14px;background:linear-gradient(90deg,rgba(0,5,18,.1),rgba(0,8,28,.83),rgba(0,5,18,.1));text-transform:uppercase;font-weight:900;letter-spacing:.09em;font-size:clamp(12px,2.2vw,27px);text-shadow:0 0 8px #168fff,0 0 20px #168fff}
.top-title:after{content:"";display:block;width:55%;height:2px;margin:5px auto 0;background:linear-gradient(90deg,transparent,var(--blue),transparent);box-shadow:0 0 8px var(--blue)}
.info-panel{position:absolute;z-index:6;left:1.7%;top:12%;width:22%;display:flex;flex-direction:column;gap:clamp(5px,.8vh,12px)}
.tile{background:var(--glass);border:1px solid var(--line);border-radius:10px;padding:clamp(7px,1.1vw,14px);box-shadow:0 0 13px rgba(0,145,255,.24),inset 0 0 14px rgba(15,97,174,.12);backdrop-filter:blur(7px);overflow:hidden}
.kicker{font-size:clamp(8px,1vw,13px);letter-spacing:.12em;color:#78caff;text-transform:uppercase;font-weight:700;margin-bottom:5px}
.value{font-size:clamp(13px,2.2vw,28px);font-weight:800;line-height:1.12;text-shadow:0 0 10px rgba(32,170,255,.35);overflow-wrap:anywhere}
.sub{font-size:clamp(9px,1vw,13px);color:#d4e8ff;margin-top:5px;line-height:1.25}
.weather-icon{font-size:clamp(20px,3vw,38px);float:right;filter:drop-shadow(0 0 7px #39baff)}
.status{display:inline-block;width:7px;height:7px;border-radius:50%;background:#4cffb0;margin-right:6px;box-shadow:0 0 8px #4cffb0}
.edit-note{position:absolute;z-index:7;right:2%;bottom:31%;max-width:40%;font-size:11px;color:#e5f5ff;background:rgba(0,7,20,.65);padding:5px 8px;border-radius:6px;opacity:.75}
@media(max-width:600px){.info-panel{width:24%;left:1.4%;top:12%;gap:5px}.tile{padding:6px;border-radius:7px}.kicker{font-size:8px;letter-spacing:.06em}.value{font-size:clamp(12px,3.2vw,18px)}.sub{font-size:9px}.top-title{left:25%;width:73%;font-size:clamp(10px,2.5vw,16px);letter-spacing:.05em}.edit-note{display:none}}
</style></head>
